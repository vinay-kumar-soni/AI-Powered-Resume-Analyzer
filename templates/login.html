{% extends "base.html" %}

{% block title %}Login - AI Resume Analyzer{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 80px auto;">
    <div class="card" style="padding: 2rem;">
        <h2 style="text-align: center; margin-bottom: 1.5rem;">🔐 Login to Your Account</h2>
        
        <form method="POST">
            <div class="form-group">
                <label>👤 Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
            </div>
            
            <div class="form-group">
                <label>🔒 Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" style="width: 100%;">Login</button>
        </form>
        
        <p style="text-align: center; margin-top: 1.5rem;">
            Don't have an account? <a href="/register" style="color: var(--accent-primary);">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
