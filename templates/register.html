{% extends "base.html" %}

{% block title %}Register - AI Resume Analyzer{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 60px auto;">
    <div class="card" style="padding: 2rem;">
        <h2 style="text-align: center; margin-bottom: 1.5rem;">📝 Create Account</h2>
        
        <form method="POST">
            <div class="form-group">
                <label>👤 Username</label>
                <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
            </div>
            
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
            </div>
            
            <div class="form-group">
                <label>🔒 Password</label>
                <input type="password" name="password" class="form-control" placeholder="Choose a strong password" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" style="width: 100%;">Register</button>
        </form>
        
        <p style="text-align: center; margin-top: 1.5rem;">
            Already have an account? <a href="/login" style="color: var(--accent-primary);">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
